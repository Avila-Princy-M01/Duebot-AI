name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (Linter)
        run: ruff check backend tests scripts

      - name: Run Mypy (Strict Type Checker)
        run: mypy --strict backend

      - name: Run Pytest (Unit, Integration & Eval Tests)
        run: pytest tests/unit tests/integration tests/eval -v

      - name: Run Offline Fallback Classifier Evaluation Benchmark
        run: python scripts/eval_reply_parser.py --mode=fallback

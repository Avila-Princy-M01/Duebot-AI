[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duebot"
version = "0.1.0"
description = "AI collections agent for overdue B2B receivables (Razorpay AI Buildathon 2026, Track 03)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "razorpay>=1.4.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "faker>=33.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
duebot-generate = "backend.data.generator:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/data/generator.py" = ["E501"]
"backend/llm/prompts/*.py" = ["E501"]
"backend/llm/reply_parser.py" = ["E501"]
"tests/**" = ["E501"]
"alembic/**" = ["E501"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["backend"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["backend.data.generator"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["razorpay.*", "razorpay"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: talks to a real or test database; still no live network",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/data/generator.py"]
